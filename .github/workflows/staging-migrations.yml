name: Migraciones a Staging

# Arquitectura: las migraciones nuevas se aplican a Staging desde el CI.
#
# - Tras cada CI verde en main: muestra qué migraciones faltan en Staging
#   (`db push --dry-run`). Solo las aplica si la variable del repositorio
#   STAGING_AUTO_APPLY vale "true".
# - A mano (Actions → Migraciones a Staging → Run workflow): dry-run, o
#   aplicar con `apply: true`.
#
# Secretos (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token personal de Supabase
#   STAGING_DB_PASSWORD    contraseña de la base de Staging
# Variables:
#   STAGING_PROJECT_REF    xyubdpmdrvaxvtiwbnro
#   STAGING_AUTO_APPLY     "true" para aplicar sin intervención
#
# Producción NUNCA se toca desde aquí (CLAUDE.md: Staging primero, se
# verifica con pgTAP y get_advisors, y luego Prod con los mismos archivos).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar las migraciones pendientes (si no, solo dry-run)"
        type: boolean
        default: false

concurrency:
  group: staging-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Supabase Staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.STAGING_PROJECT_REF }}
      APPLY: ${{ inputs.apply == true || (github.event_name == 'workflow_run' && vars.STAGING_AUTO_APPLY == 'true') }}
    steps:
      - name: Comprobar configuración
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Faltan SUPABASE_ACCESS_TOKEN, STAGING_DB_PASSWORD o STAGING_PROJECT_REF; no se toca Staging."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          # El commit que pasó el CI, no el último de main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.ready == 'true'
        name: Enlazar Staging
        run: pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - if: steps.config.outputs.ready == 'true'
        name: Migraciones locales vs. Staging
        run: pnpm exec supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - if: steps.config.outputs.ready == 'true'
        name: Dry-run
        run: pnpm exec supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - if: steps.config.outputs.ready == 'true' && env.APPLY == 'true'
        name: Aplicar en Staging
        run: pnpm exec supabase db push --password "$SUPABASE_DB_PASSWORD"
