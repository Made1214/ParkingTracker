name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, test, format y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de relleno: la app los exige al cargar next.config, pero el
      # build no se conecta a Supabase. Nunca poner secretos reales aquí.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard against service_role in src/
        run: '! grep -rnE "service_role|SUPABASE_SERVICE_ROLE_KEY" src/'
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build

  database:
    name: Migraciones y pruebas RLS (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Aplica todas las migraciones y el seed desde cero en Docker.
      - run: pnpm db:start
      - run: pnpm db:test
      - if: always()
        run: pnpm exec supabase stop --no-backup
