# Actualizaciones de dependencias (issue #54). Se revisan cada dos semanas (los
# días 1 y 15) y las de npm se agrupan en un solo PR, en vez de uno por paquete,
# para no inundar la revisión. Dependabot no tiene un intervalo "quincenal":
# `cron` es la forma de pedirlo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: America/Panama
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
      timezone: America/Panama
