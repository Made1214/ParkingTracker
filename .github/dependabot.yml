# Actualizaciones de dependencias (issue #54). Un PR agrupado por semana, en
# vez de uno por paquete, para no inundar la revisión.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
